# Windows Media Player Online Store configuration.
#
# The store is OFF by default. Set enabled = true to serve the storefront.
# Nothing in the Find Album Info feature depends on this file; if it is
# missing or wrong, the FAI server still starts and still works.
#
# Every value here can be overridden without editing this file:
#   * a WMP_STORE_<NAME> environment variable, e.g. WMP_STORE_BASE_URL
#   * WMP_STORE_<NAME> in local_settings.py (git-ignored)
# Environment beats local_settings, which beats this file, which beats the
# built-in defaults. Run `python "FAI Server.py" online-store-status` to see
# both the effective value and where it came from.

[online_store]

# Master switch. The installer refuses to register a store that is not
# enabled, because pointing WMP at a URL that answers 503 helps nobody.
enabled = true

# keyName. This is the store's identity to WMP: it becomes a registry key
# component under ...\MediaPlayer\Subscriptions, and it is also the Key
# attribute of the ServiceInfo document. The two MUST match. Must be a bare
# key component - no slashes, spaces, colons or backslashes.
store_id = legacy_music_store

# Shown to the user as the store's name, and written to ServiceInfo's
# FriendlyName. This is a development store, so it is NOT named after any
# commercial provider.
friendly_name = Legacy Music Store

# Where WMP reaches the storefront. The host part must be resolvable and
# reachable from WMP; 127.0.0.1 is correct for the usual single-machine
# setup, since this server already listens on port 80.
#
# The path must end in the same prefix the blueprint is mounted at
# (/online-store). The ServiceInfo document, the registry BASEURL and the
# page URLs are all derived from this one value.
base_url = http://127.0.0.1/online-store

# Written to the documented SubscriptionObjectGUID registry value.
#
# This is a GUID generated for this project. It is deliberately NOT a
# Microsoft GUID and NOT one belonging to any real store (7digital, Bandcamp,
# Qobuz, Juno, Napster, Rhapsody). Do not change it to a real provider's GUID
# to make the store "look real" - that is how two installations end up
# claiming one identity.
subscription_object_guid = {b4867d0f-fb79-4efb-86d0-c2c94410ee15}

# Test key. Microsoft issues these to developers whose store has been
# submitted for publishing; an unpublished store is only visible to WMP while
# its key is listed in HKCU\...\MediaPlayer\Services\TestParameter. The
# installer appends this to that list. The value here is locally chosen, and
# the docs require only that the list contain it.
test_key = 9100

# Plug-in capability flags. 0 = none, which is correct and intended: a Type 2
# *commerce* store has no IWMPSubscriptionService plug-in, so there are no
# callbacks for WMP to make. Microsoft documents 0xF (SUBSCRIPTION_V1_CAPS) as
# the value to use when a v1 plug-in exists but registered no flags - that is
# NOT our case, and setting it would make WMP call allowPlay/allowCDBurn on a
# class that does not exist. Raise it only when a real plug-in is registered.
capabilities = 0

# Store images. Left empty, they are omitted from the ServiceInfo document
# rather than written as empty URLs - a consumer that tries to fetch "" gets a
# request for the current page instead of a placeholder. Point these at real
# URLs on this server to enable them, e.g.
#   menu_image_url = http://127.0.0.1/online-store/art/lms-0001
#   large_image_url = http://127.0.0.1/online-store/art/lms-0001
menu_image_url =
large_image_url =

# Button colours, used for the Online Stores tab button. WMP's own dark
# theme is around #1F5C99, so these match the rest of the player.
button_color = #1F5C99
button_text_color = #FFFFFF

# Which catalog backend to use. `local_fake` is the only bundled provider and
# is entirely offline. A real provider is added by dropping a module into
# online_store/providers/ and registering it - nothing else changes.
provider = local_fake

# Where bought files are written. Empty means
# %APPDATA%\WMP_FAIServer\online_store_purchases, the same place the server
# already keeps its certificate and log.
purchases_dir =

currency = USD
